[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "walkie-relay"
version = "0.1.0"
description = "Wi-Fi walkie-talkie POC relay"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<18"]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
walkie-relay = "walkie_relay.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
